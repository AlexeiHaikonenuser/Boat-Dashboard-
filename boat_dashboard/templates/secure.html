<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .secure-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="secure-card p-5">
        <div class="text-center mb-4">
            <h4 class="fw-bold">Secure Access</h4>
            <p class="text-muted small">Enter the security code to continue</p>
        </div>
        <form method="POST">
            <div class="mb-4">
                <input type="password" name="secure_code" class="form-control text-center"
                       placeholder="Enter secure code" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Continue</button>
        </form>
    </div>
</body>
</html>
