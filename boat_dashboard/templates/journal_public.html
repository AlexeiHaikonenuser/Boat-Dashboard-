<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ journal_title or 'Journal' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fafafa; }
        .post-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width: 820px;">
    <h1 class="fw-bold mb-4">{{ journal_title or 'Journal' }}</h1>
    {% for trip in trips %}
    <article class="border-bottom py-4">
        <div class="row g-4 align-items-center">
            {% if trip.images %}
            <div class="col-md-5">
                <a href="/{{ boat_slug }}/journal/{{ trip.id }}">
                    <img src="/static/{{ trip.images[0].image_path }}" class="post-img rounded">
                </a>
            </div>
            {% endif %}
            <div class="{% if trip.images %}col-md-7{% else %}col-12{% endif %}">
                <div class="text-muted small mb-1">{{ trip.start_time | ddmmyyyy }}</div>
                <h3 class="mb-2">
                    <a href="/{{ boat_slug }}/journal/{{ trip.id }}" class="text-dark text-decoration-none">
                        {{ trip.title or 'Untitled' }}
                    </a>
                </h3>
                {% if trip.notes %}
                <p class="text-muted mb-0" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                    {{ trip.notes }}
                </p>
                {% endif %}
                <div class="mt-2">
                    <a href="/{{ boat_slug }}/journal/{{ trip.id }}" class="text-decoration-none small">
                        Read more →
                    </a>
                </div>
            </div>
        </div>
    </article>
    {% else %}
        <div class="text-center py-5 text-muted">
            <h4>No entries yet</h4>
        </div>
    {% endfor %}
</div>
</body>
</html>
