<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.boat_name or 'Boat' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8fafc; color: #1e293b; }
        .header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 1rem 0; }
        .header h1 { font-size: 1.35rem; margin: 0; font-weight: 600; }
        .section { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .section h5 { font-weight: 600; margin-bottom: 1rem; color: #0f172a; }
        .photo { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .photo:hover { opacity: 0.92; }
        .tip { padding: 0.75rem 0; border-bottom: 1px solid #f1f5f9; }
        .tip:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container d-flex justify-content-between align-items-center">
            <h1>{{ settings.boat_name or 'Boat' }}</h1>
            <div class="d-flex gap-1">
                <a href="?lang=en" class="btn btn-sm btn-light">EN</a>
                <a href="?lang=fi" class="btn btn-sm btn-light">FI</a>
                <a href="?lang=sv" class="btn btn-sm btn-light">SV</a>
                <a href="?lang=ru" class="btn btn-sm btn-light">RU</a>
                <a href="?lang=de" class="btn btn-sm btn-light">DE</a>
            </div>
        </div>
    </div>
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Image Modal -->
    <div class="modal fade" id="imgModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-2 pt-0 text-center">
                    <img id="fullImg" src="" class="img-fluid rounded" style="max-height: 80vh;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showImg(src) {
            document.getElementById('fullImg').src = src;
            new bootstrap.Modal(document.getElementById('imgModal')).show();
        }
    </script>
</body>
</html>
