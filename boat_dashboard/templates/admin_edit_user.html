{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">
                {{ get_text('edit_user', session.get('language', 'en')) }}: {{ user.username }}
            </h2>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">{{ get_text('username', session.get('language', 'en')) }}</label>
                                <input type="text" name="username" class="form-control" 
                                       value="{{ user.username }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ get_text('role', session.get('language', 'en')) }}</label>
                                <select name="role" class="form-select">
                                    <option value="user" {{ 'selected' if user.role == 'user' }}>
                                        {{ get_text('visitor', session.get('language', 'en')) }}
                                    </option>
                                    <option value="admin" {{ 'selected' if user.role == 'admin' }}>
                                        {{ get_text('admin', session.get('language', 'en')) }}
                                    </option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <label class="form-label">
                                {{ get_text('new_password', session.get('language', 'en')) }}
                                <small class="text-info">({{ get_text('leave_blank_keep_current', session.get('language', 'en')) }})</small>
                            </label>
                            <input type="password" name="password" class="form-control">
                        </div>
                        
                        <div class="mt-3">
                            <label class="form-label">{{ get_text('admin_notes', session.get('language', 'en')) }}</label>
                            <textarea name="notes" class="form-control" rows="4">{{ user.notes or '' }}</textarea>
                            <small class="text-info">{{ get_text('visible_only_to_admins', session.get('language', 'en')) }}</small>
                        </div>
                        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">
                                {{ get_text('save_changes', session.get('language', 'en')) }}
                            </button>
                            <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">
                                {{ get_text('cancel', session.get('language', 'en')) }}
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
