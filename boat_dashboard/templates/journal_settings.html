{% extends "base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <h2 class="fw-bold mb-4">{{ get_text('journal_settings', session.get('language', 'en')) }}</h2>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">{{ get_text('journal_title', session.get('language', 'en')) }}</label>
                    <input type="text" name="journal_title" class="form-control"
                           value="{{ journal_title }}" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    {{ get_text('save', session.get('language', 'en')) }}
                </button>
            </form>
        </div>
    </div>

    <a href="{{ url_for('journal') }}" class="btn btn-outline-secondary mt-3">
        ← {{ get_text('back', session.get('language', 'en')) }}
    </a>
</div>
{% endblock %}
